[project]
name = "sesurface"
version = "0.1.0"
description = "Enumerate the object surface an Android SELinux subject can reach, with full per-gate provenance, from an unpacked firmware image."
readme = "README.md"
requires-python = ">=3.10"

# Hard, pip-installable dependencies only. The heavy SELinux machinery
# (setools, libselinux, secilc) is NOT on PyPI -- it is provided by the distro and
# made visible to the venv with `uv venv --system-site-packages`. See the README
# and scripts/bootstrap-ubuntu.sh. `sesurface doctor` reports whether it is present.
dependencies = [
    "androguard>=4.1.0",   # APK manifest / signing cert / DEX parsing (app subjects).
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# ELF string-scanning (e.g. native addService("name")) for the service-host and
# code-locator stages. Optional because the policy `service_manager add` query
# recovers most hosts without it.
elf = ["pyelftools>=0.29"]

[project.scripts]
sesurface = "sesurface.cli:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sesurface"]
